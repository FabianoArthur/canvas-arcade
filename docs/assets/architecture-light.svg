<path d="M544,122 L564,122 L564,116 L604,116" class="e" marker-end="url(#ah)"/>
<path d="M720,148 L720,188" class="e" marker-end="url(#ah)"/>
<path d="M720,252 L720,292" class="e" marker-end="url(#ah)"/>
<path d="M604,136 L574,136 L574,296 L544,296" class="e" marker-end="url(#ah)"/>
<path d="M574,296 L574,384 L544,384" class="e" marker-end="url(#ah)"/>
<path d="M264,172 L284,172 L284,132 L304,132" class="e dash" marker-end="url(#ah)"/>
<text x="566" y="224" class="m" text-anchor="end">events · score</text>
<text x="24" y="376" class="b">No DOM in game logic:</text>
<text x="24" y="396" class="m">it runs under Vitest in Node.</text>
